<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Здоровое питание{% endblock %} | Health_G</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-md navbar-dark bg-success shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
        <i data-lucide="heart-pulse" class="hg-icon hg-icon-nav" aria-hidden="true"></i>
        <span>Health_G</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Меню">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-md-2">
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center gap-1 {% if request.endpoint == 'index' %}active fw-semibold{% endif %}" href="{{ url_for('index') }}">
              <i data-lucide="home" class="hg-icon hg-icon-nav" aria-hidden="true"></i><span>Главная</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center gap-1 {% if request.endpoint == 'about_nutrition' %}active fw-semibold{% endif %}" href="{{ url_for('about_nutrition') }}">
              <i data-lucide="book-open" class="hg-icon hg-icon-nav" aria-hidden="true"></i><span>О питании</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center gap-1 {% if request.endpoint == 'products' %}active fw-semibold{% endif %}" href="{{ url_for('products') }}">
              <i data-lucide="shopping-basket" class="hg-icon hg-icon-nav" aria-hidden="true"></i><span>Продукты</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center gap-1 {% if request.endpoint == 'calculator' %}active fw-semibold{% endif %}" href="{{ url_for('calculator') }}">
              <i data-lucide="calculator" class="hg-icon hg-icon-nav" aria-hidden="true"></i><span>Калькулятор</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1 py-4 py-md-5">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-dark text-light py-4 mt-auto">
    <div class="container">
      <div class="row row-cols-1 row-cols-md-2 align-items-center g-3">
        <div class="col text-center text-md-start">
          <p class="mb-0 small d-flex align-items-start justify-content-center justify-content-md-start gap-2">
            <i data-lucide="info" class="hg-icon hg-icon-footer flex-shrink-0" aria-hidden="true"></i>
            <span>Материалы носят ознакомительный характер. При заболеваниях обратитесь к врачу или диетологу.</span>
          </p>
        </div>
        <div class="col text-center text-md-end">
          <span class="small text-secondary">© {{ 2026 }} Health_G</span>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script src="{{ url_for('static', filename='js/icons.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
